# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu mỗi nhóm, tức 42 người mỗi nhóm. Có 40 người, cần 84.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng luôn dưới 1.000, thiếu mẫu cho mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng luôn dưới 300.
#   e) Mức chênh 6 điểm: cần ít nhất 299 yêu cầu mỗi người, DE = 6,96, 5.980 yêu cầu thực mỗi nhóm (859,20 hiệu dụng).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có: 20 nhân viên đối chứng làm việc song song cùng tuần, cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo staff_id và log truy cập.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã viết trước: chỉ số chính, ngưỡng dừng và ngày quyết định chốt trước ngày bắt đầu pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có: đúng 20 nhân viên (20 cụm) mỗi nhánh can thiệp và đối chứng.
#
# Đánh đổi để nhóm quyết định: chia theo nhân viên 20 + 20 giúp hạn chế việc
# cùng một nhân viên xử lý cả hai nhánh. Phương án này chỉ đủ power cho +6 điểm
# nếu mỗi người đạt ít nhất 299 yêu cầu đủ điều kiện và đã theo dõi trọn 7 ngày.
# Xác nhận khối lượng theo nhân viên trong phạm vi pilot trước khi chốt ngày quyết định.
#
# Tỉ lệ mo_lai_trong_7_ngay trong dữ liệu giả lập: 51/1.200 = 4,25% toàn bộ; 39/982 = 3,97% cho noi_dia + hang_nang.
# Khi rà luật dừng, dùng tỉ lệ của đúng phạm vi pilot và chỉ đếm yêu cầu đã đủ cửa sổ theo dõi 7 ngày.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88× [simulated], thành công 27,3%) và doi_tac (0,85× [simulated], thành công 54,4%)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi chấp nhận mức chênh 6 điểm do giới hạn 40 nhân viên (power 0,64 ở mức 5 điểm)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng mỗi nhóm
    design_effect: 6.96           # DE = 1 + (299 - 1) * 0.02 = 6.96
    clusters_per_arm: 20          # 20 nhân viên mỗi nhóm
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm việc song song cùng tuần, cùng 12 depot"
    spillover_risk: "Rủi ro chia sẻ câu trả lời giữa nhân viên trong depot; giảm bằng phân quyền tài khoản riêng và log theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng dừng, thời hạn đánh giá và phân bổ nhóm được chốt trước ngày bắt đầu pilot"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6%, hoặc có ≥ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated"
    - "phut_lam_lai_simulated"
    - "chi_phi_moi_viec_thanh_cong_simulated"
